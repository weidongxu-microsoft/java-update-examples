server.port=8080

# Azure Storage configuration
# For Azure deployment: set AZURE_STORAGE_ACCOUNT_NAME env var (uses Managed Identity)
# For local dev with Azurite: leave defaults (uses connection string)
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1}

# Default container name for quick-start
azure.storage.default-container=demo-files

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
