<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud File Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
            </svg>
            <h1>Cloud File Manager</h1>
        </div>
        <span class="badge">Azure Blob Storage</span>
    </header>

    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Containers</h2>
                <button id="btn-new-container" class="btn btn-sm" title="New container">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
            <ul id="container-list" class="container-list"></ul>
        </aside>

        <main class="content">
            <div id="empty-state" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <p>Select a container to browse files</p>
            </div>

            <div id="container-view" class="container-view" style="display: none;">
                <div class="toolbar">
                    <h2 id="current-container-name"></h2>
                    <div class="toolbar-actions">
                        <button id="btn-upload" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                            Upload Files
                        </button>
                        <button id="btn-delete-container" class="btn btn-danger" title="Delete container">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>

                <div id="drop-zone" class="drop-zone" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
                        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                    </svg>
                    <p>Drop files here to upload</p>
                </div>

                <div id="upload-progress" class="upload-progress" style="display: none;">
                    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                    <span id="progress-text">Uploading...</span>
                </div>

                <div id="blob-list" class="blob-grid"></div>

                <div id="blobs-empty" class="empty-state" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
                    </svg>
                    <p>No files yet — upload some!</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" multiple style="display: none;">

    <!-- Modal for new container -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h3>Create New Container</h3>
            <input type="text" id="new-container-input" placeholder="container-name" pattern="[a-z0-9-]+" autofocus>
            <p class="hint">Lowercase letters, numbers, and hyphens only</p>
            <div class="modal-actions">
                <button id="btn-cancel-modal" class="btn">Cancel</button>
                <button id="btn-confirm-modal" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
